<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lumora Saúde · Portal do Prestador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b6e63'/%3E%3Cpath d='M8 20a8 8 0 0 1 16 0' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<header class="topo">
  <div class="marca">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#fff"/><path d="M8 20a8 8 0 0 1 16 0" stroke="#0b6e63" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="16" cy="11" r="2.4" fill="#14a38e"/></svg>
    <strong>Lumora Saúde</strong><span>Portal do Prestador</span>
  </div>
</header>
<main>
  <div class="login cartao">
    <h1>Acesso do prestador</h1>
    <p class="sub">Clínicas e profissionais credenciados.</p>
    <form id="form-login" novalidate>
      <div id="erro" class="erro-msg" role="alert"></div>
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" autocomplete="username" autocapitalize="off" spellcheck="false">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password">
      </div>
      <button class="primario" type="submit" style="width:100%">Entrar</button>
    </form>
  </div>
</main>
<footer class="rodape">Ambiente de demonstração · sistema e dados fictícios · v2 · <button type="button" onclick="reiniciar()">Reiniciar demonstração</button></footer>
<script src="app.js?v=2"></script>
<script>
  if (estado().sessao) location.replace('solicitar.html');
  document.getElementById('form-login').addEventListener('submit', async ev => {
    ev.preventDefault();
    const u = document.getElementById('usuario').value.trim().toLowerCase();
    let h = '';
    try { h = await sha256(document.getElementById('senha').value); }
    catch (e) { document.getElementById('erro').textContent = 'Não foi possível verificar a senha neste navegador.'; return; }
    if (u !== USUARIO || h !== SENHA_SHA256) {
      document.getElementById('erro').textContent = 'Usuário ou senha inválidos.';
      return;
    }
    const s = estado(); s.sessao = { usuario: u, desde: new Date().toISOString() }; grava(s);
    location.href = 'solicitar.html';
  });
</script>
</body>
</html>
